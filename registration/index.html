<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent Registration System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="banner-container"></div>
    <main>
        <div class="form-card">
            <h1 id="form-title">Registration Form</h1>
            <form id="registrationForm" novalidate autocomplete="off">
                <div class="form-row">
                  <div class="form-group">
                      <label for="firstName">First Name<span class="required">*</span></label>
                      <input type="text" id="firstName" name="firstName" required>
                      <div class="error-message" id="firstName-error"></div>
                  </div>
                  <div class="form-group">
                      <label for="lastName">Last Name<span class="required">*</span></label>
                      <input type="text" id="lastName" name="lastName" required>
                      <div class="error-message" id="lastName-error"></div>
                  </div>
                </div>
                <div class="form-row">
                  <div class="form-group">
                      <label for="email">Email<span class="required">*</span></label>
                      <input type="email" id="email" name="email" required>
                      <div class="error-message" id="email-error"></div>
                  </div>
                  <div class="form-group">
                      <label for="phone">Phone Number<span class="required">*</span></label>
                      <input type="tel" id="phone" name="phone" required>
                      <div class="error-message" id="phone-error"></div>
                  </div>
                </div>
                <div class="form-row">
                  <div class="form-group">
                      <label for="country">Country</label>
                      <select id="country" name="country">
                          <option value="">Select</option>
                      </select>
                      <div class="error-message" id="country-error"></div>
                  </div>
                  <div class="form-group">
                      <label for="state">State</label>
                      <select id="state" name="state">
                          <option value="">Select</option>
                      </select>
                      <div class="error-message" id="state-error"></div>
                  </div>
                </div>
                <div class="form-row">
                  <div class="form-group">
                      <label for="city">City</label>
                      <select id="city" name="city">
                          <option value="">Select</option>
                      </select>
                      <div class="error-message" id="city-error"></div>
                  </div>
                  <div class="form-group">
                      <label for="age">Age</label>
                      <input type="number" id="age" name="age" min="0">
                      <div class="error-message" id="age-error"></div>
                  </div>
                </div>
                <div class="form-group full-width">
                    <label for="address">Address</label>
                    <input type="text" id="address" name="address">
                    <div class="error-message" id="address-error"></div>
                </div>
                <div class="form-group full-width">
                    <label for="gender">Gender<span class="required">*</span></label>
                    <select id="gender" name="gender" required>
                        <option value="">Select</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                    <div class="error-message" id="gender-error"></div>
                </div>
                <div class="form-group full-width">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password">
                    <div class="password-strength" id="password-strength">
                        <div class="strength-bar" id="strength-bar"></div>
                        <span id="strength-text"></span>
                    </div>
                    <div class="error-message" id="password-error"></div>
                </div>
                <div class="form-group full-width">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword">
                    <div class="error-message" id="confirmPassword-error"></div>
                </div>
                <div class="form-group terms full-width">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I agree to the Terms & Conditions<span class="required">*</span></label>
                    <div class="error-message" id="terms-error"></div>
                </div>
                <div class="form-actions">
                    <button type="submit" id="submitBtn" disabled>Submit</button>
                    <button type="reset" id="resetBtn" class="secondary">Reset</button>
                </div>
            </form>
        </div>
    </main>
    <script src="script.js"></script>
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                console.log('DOM fully loaded and parsed');
            });
        </script>
</body>
</html>
